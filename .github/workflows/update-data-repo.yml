name: Update NAM CONUS Data (Sequential with Repo Storage)

on:
  # Run every 6 hours (aligned with NAM update cycles: 00, 06, 12, 18 UTC)
  # Adding 3.5 hour offset to ensure data is available
  schedule:
    - cron: "30 3,9,15,21 * * *"  # 03:30, 09:30, 15:30, 21:30 UTC

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main and claude branches (for testing)
  push:
    branches:
      - main
      - claude/**

permissions:
  contents: write

jobs:
  # Process forecast hours 0-10 (11 hours) - FIRST JOB
  process-chunk-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Process chunk 1 (hours 0-10)
        run: |
          python scripts/process_chunk.py 0 10 1
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk 1 to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nam_conus_*_chunk1.zarr/

          if git diff --staged --quiet; then
            echo "No chunk to commit"
          else
            git commit -m "Add chunk 1 (hours 0-10) for $(date -u +%Y%m%d_%H)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

  # Process forecast hours 11-20 (10 hours) - AFTER CHUNK 1
  process-chunk-2:
    runs-on: ubuntu-latest
    needs: process-chunk-1
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Process chunk 2 (hours 11-20)
        run: |
          python scripts/process_chunk.py 11 20 2
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk 2 to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nam_conus_*_chunk2.zarr/

          if git diff --staged --quiet; then
            echo "No chunk to commit"
          else
            git commit -m "Add chunk 2 (hours 11-20) for $(date -u +%Y%m%d_%H)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

  # Process forecast hours 21-30 (10 hours) - AFTER CHUNK 2
  process-chunk-3:
    runs-on: ubuntu-latest
    needs: process-chunk-2
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Process chunk 3 (hours 21-30)
        run: |
          python scripts/process_chunk.py 21 30 3
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk 3 to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nam_conus_*_chunk3.zarr/

          if git diff --staged --quiet; then
            echo "No chunk to commit"
          else
            git commit -m "Add chunk 3 (hours 21-30) for $(date -u +%Y%m%d_%H)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

  # Process forecast hours 31-40 (10 hours) - AFTER CHUNK 3
  process-chunk-4:
    runs-on: ubuntu-latest
    needs: process-chunk-3
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Process chunk 4 (hours 31-40)
        run: |
          python scripts/process_chunk.py 31 40 4
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk 4 to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nam_conus_*_chunk4.zarr/

          if git diff --staged --quiet; then
            echo "No chunk to commit"
          else
            git commit -m "Add chunk 4 (hours 31-40) for $(date -u +%Y%m%d_%H)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

  # Process forecast hours 41-50 (10 hours) - AFTER CHUNK 4
  process-chunk-5:
    runs-on: ubuntu-latest
    needs: process-chunk-4
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Process chunk 5 (hours 41-50)
        run: |
          python scripts/process_chunk.py 41 50 5
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk 5 to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nam_conus_*_chunk5.zarr/

          if git diff --staged --quiet; then
            echo "No chunk to commit"
          else
            git commit -m "Add chunk 5 (hours 41-50) for $(date -u +%Y%m%d_%H)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

  # Process forecast hours 51-60 (10 hours) - AFTER CHUNK 5
  process-chunk-6:
    runs-on: ubuntu-latest
    needs: process-chunk-5
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          uv pip install --system -e .

      - name: Process chunk 6 (hours 51-60)
        run: |
          python scripts/process_chunk.py 51 60 6
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk 6 to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/nam_conus_*_chunk6.zarr/

          if git diff --staged --quiet; then
            echo "No chunk to commit"
          else
            git commit -m "Add chunk 6 (hours 51-60) for $(date -u +%Y%m%d_%H)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

  # Merge all chunks into final dataset - AFTER ALL CHUNKS
  merge-and-publish:
    runs-on: ubuntu-latest
    needs: [process-chunk-1, process-chunk-2, process-chunk-3, process-chunk-4, process-chunk-5, process-chunk-6]
    timeout-minutes: 15

    steps:
      - name: Checkout repository (with all chunks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes (to get all chunks)
        run: |
          git pull origin ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        run: |
          uv pip install --system xarray zarr

      - name: List available chunks
        run: |
          echo "=== Chunks in repo ==="
          ls -lh data/ || echo "No data directory"
          find data/ -name "*chunk*.zarr" -type d || echo "No chunk files"

      - name: Merge chunks into final dataset
        run: |
          python scripts/merge_chunks.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Remove chunk files (keep only final dataset)
        run: |
          echo "=== Cleaning up chunk files ==="
          rm -rf data/nam_conus_*_chunk*.zarr

          echo "=== Remaining datasets ==="
          ls -lh data/*.zarr 2>/dev/null || echo "No datasets found"

      - name: Keep only last 2 final datasets
        run: |
          echo "=== Removing old final datasets ==="
          # List all non-chunk zarr stores, sorted by name (which includes date)
          # Keep the 2 most recent, delete the rest
          cd data
          ls -t nam_conus_[0-9]*.zarr 2>/dev/null | grep -v chunk | tail -n +3 | xargs -r rm -rf
          cd ..

          echo "=== Final datasets kept ==="
          ls -lh data/nam_conus_[0-9]*.zarr 2>/dev/null | grep -v chunk || echo "No final datasets"

      - name: Generate data catalog
        run: |
          python scripts/generate_catalog.py
        continue-on-error: true

      - name: Commit final dataset and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add final dataset and catalog
          git add data/nam_conus_[0-9]*.zarr/ catalog/

          # Remove chunk files from git if they were added
          git rm -rf data/nam_conus_*_chunk*.zarr/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NAM CONUS dataset and catalog - $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      - name: Show final dataset info
        run: |
          echo "=== Final Dataset ==="
          ls -lh data/nam_conus_[0-9]*.zarr 2>/dev/null | grep -v chunk || echo "No final dataset"
          echo ""
          echo "=== Catalog ==="
          cat catalog/catalog.json 2>/dev/null || echo "No catalog"
