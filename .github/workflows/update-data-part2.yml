name: NAM Data Part 2 - Hours 31-60

on:
  # Manual trigger only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Process hours 31-40
  chunk-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          uv pip install --system -e .

      - name: Process chunk 4 (hours 31-40)
        run: python scripts/process_chunk.py 31 40 4
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          git add data/nam_conus_*_chunk4.zarr/

          if ! git diff --staged --quiet; then
            git commit -m "Add chunk 4 (hours 31-40)"

            # Retry push up to 5 times with exponential backoff
            for i in {1..5}; do
              if git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }}; then
                echo "Push succeeded"
                break
              else
                if [ $i -lt 5 ]; then
                  sleep_time=$((2 ** i))
                  echo "Push failed, retrying in ${sleep_time}s (attempt $i/5)..."
                  sleep $sleep_time
                else
                  echo "Push failed after 5 attempts"
                  exit 1
                fi
              fi
            done
          fi

  # Process hours 41-50
  chunk-5:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
