      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          uv pip install --system -e .

      - name: Process chunk 5 (hours 41-50)
        run: python scripts/process_chunk.py 41 50 5
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add random delay to avoid concurrent pushes (0-10 seconds)
          sleep $((RANDOM % 10))

          git pull --rebase origin ${{ github.ref_name }}
          git add data/nam_conus_*_chunk5.zarr/

          if ! git diff --staged --quiet; then
            git commit -m "Add chunk 5 (hours 41-50)"

            # Retry push up to 5 times with exponential backoff
            for i in {1..5}; do
              if git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }}; then
