                break
              else
                if [ $i -lt 5 ]; then
                  sleep_time=$((2 ** i))
                  echo "Push failed, retrying in ${sleep_time}s (attempt $i/5)..."
                  sleep $sleep_time
                else
                  echo "Push failed after 5 attempts"
                  exit 1
                fi
              fi
            done
          fi

  # Process hours 51-60
  chunk-6:
