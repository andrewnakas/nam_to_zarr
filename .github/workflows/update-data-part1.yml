name: NAM Data Part 1 - Hours 0-30

on:
  # Run every 6 hours
  schedule:
    - cron: "30 3,9,15,21 * * *"  # 03:30, 09:30, 15:30, 21:30 UTC

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to test
  push:
    branches:
      - main
      - claude/**

permissions:
  contents: write
  actions: write

jobs:
  # Process hours 0-10
  chunk-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          uv pip install --system -e .

      - name: Process chunk 1 (hours 0-10)
        run: python scripts/process_chunk.py 0 10 1
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nam_conus_*_chunk1.zarr/
          git diff --staged --quiet || (git commit -m "Add chunk 1 (hours 0-10)" && git pull --rebase && git push)

  # Process hours 11-20
  chunk-2:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          uv pip install --system -e .

      - name: Process chunk 2 (hours 11-20)
        run: python scripts/process_chunk.py 11 20 2
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/nam_conus_*_chunk2.zarr/
          git diff --staged --quiet || (git commit -m "Add chunk 2 (hours 11-20)" && git pull --rebase && git push)

  # Process hours 21-30
  chunk-3:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          uv pip install --system -e .

      - name: Process chunk 3 (hours 21-30)
        run: python scripts/process_chunk.py 21 30 3
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit chunk to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/nam_conus_*_chunk3.zarr/
          git diff --staged --quiet || (git commit -m "Add chunk 3 (hours 21-30)" && git pull --rebase && git push)

  # Note: Part 2 will trigger automatically when chunks 1-3 are pushed
