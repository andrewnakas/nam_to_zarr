[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nam-to-zarr"
version = "0.1.0"
description = "Automated reformatting of NOAA NAM CONUS Nest (3km) forecast data to Zarr format with projection coordinates"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrew Nakas", email = "andrewnakas@users.noreply.github.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.26.0",
    "xarray>=2024.1.0",
    "zarr>=2.16.0",
    "cfgrib>=0.9.10",
    "eccodes>=1.6.0",
    "pyproj>=3.6.0",
    "dask>=2024.1.0",
    "netcdf4>=1.6.5",
    "fsspec>=2024.1.0",
    "s3fs>=2024.1.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/andrewnakas/nam_to_zarr"
Repository = "https://github.com/andrewnakas/nam_to_zarr"
Issues = "https://github.com/andrewnakas/nam_to_zarr/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["nam_to_zarr"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "cfgrib.*",
    "eccodes.*",
    "zarr.*",
    "pyproj.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--cov=nam_to_zarr",
    "--cov-report=term-missing",
    "--cov-report=html",
]
